<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06100c"/><stop offset="1" stop-color="#0e261d"/></linearGradient>
    <radialGradient id="glow" cx="0.80" cy="0.05" r="0.75"><stop offset="0" stop-color="#3ddc97" stop-opacity="0.34"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="0.0" cy="1.0" r="0.6"><stop offset="0" stop-color="#2f5bff" stop-opacity="0.16"/><stop offset="1" stop-color="#2f5bff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#e8f0ec" stroke-opacity="0.055"/></pattern>
    <linearGradient id="hijau" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
    <filter id="bayang" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
    <clipPath id="klip"><rect width="1280" height="380" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#klip)">
